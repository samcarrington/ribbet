[project]
name = "ribbet"
version = "0.1.0"
description = "Local meeting transcription app for macOS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
ml = [
    "moshi_mlx",
    "rustymimi",
    "mlx-lm",
    "pyobjc-framework-ScreenCaptureKit",
    "numpy",
    "soundfile",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "macos: requires macOS 13+ and Screen Recording permission",
    "slow: requires ML model download (~2GB)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
